<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>功能選單範例網站</title>
  <link rel="stylesheet" href="/AI-helper-MK-II/css/style.css">
</head>
<body>
  <!-- 導覽列 -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="#home-section" class="nav-link active">首頁</a></li>
      <li><a href="#chat-section" class="nav-link">對話框</a></li>
      <li><a href="#team-section" class="nav-link">人員介紹</a></li>
      <li><a href="#login-section" class="nav-link">登入</a></li>
    </ul>
  </nav>

  <main class="container">
    <!-- IP顯示 -->
    <div class="ip-info">你的IP位置是：<span id="ip-address">載入中...</span></div>

    <!-- 首頁區塊 -->
    <section id="home-section" class="page-section active">
      <div class="welcome">你好，歡迎使用本系統~</div>
      <section id="quick-links">
        <h2>常用連結</h2>
        <div class="links-center">
          <a href="https://www.google.com" class="quick-link" target="_blank">Google</a>
          <a href="https://www.youtube.com" class="quick-link" target="_blank">YouTube</a>
          <a href="https://www.github.com" class="quick-link" target="_blank">GitHub</a>
        </div>
      </section>
    </section>

    <!-- 對話框區塊 -->
    <section id="chat-section" class="page-section">
      <div class="chat-container">
        <div id="chat-history" class="chat-history"></div>
        <div class="input-group">
          <input type="text" id="message-input" placeholder="請輸入訊息..." class="chat-input">
          <div class="file-upload-group">
            <label for="file-upload" class="upload-label">
              <span class="upload-icon">📁</span>
              <span>上傳檔案</span>
              <input type="file" id="file-upload" accept=".docx,.csv" style="display:none;">
            </label>
            <button id="send-btn" class="interactive-btn">送出</button>
          </div>
          <p class="file-hint">檔案限制格式：word、csv</p>
        </div>
      </div>
    </section>

    <!-- 人員介紹區塊 -->
    <section id="team-section" class="page-section">
      <div class="team-members">
        <div class="member">
          <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="成員A">
          <h3>成員A</h3>
          <p>職稱：前端工程師</p>
        </div>
        <div class="member">
          <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="成員B">
          <h3>成員B</h3>
          <p>職稱：後端工程師</p>
        </div>
        <div class="member">
          <img src="https://randomuser.me/api/portraits/men/54.jpg" alt="成員C">
          <h3>成員C</h3>
          <p>職稱：設計師</p>
        </div>
      </div>
    </section>

    <!-- 登入區塊（可自訂內容） -->
    <section id="login-section" class="page-section">
      <div class="welcome">登入功能尚未開放</div>
    </section>
  </main>

  <!-- 亮/暗模式切換按鈕 -->
  <button id="darkModeToggle" class="dark-mode-btn" aria-label="切換亮暗模式">亮/暗模式</button>

  <script src="/AI-helper-MK-II/js/script.js"></script>
</body>
</html>
